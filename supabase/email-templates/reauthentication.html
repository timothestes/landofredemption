<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>Your verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#111113;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#111113;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#1a1a1e;border:1px solid #2a2a2e;border-radius:12px;">
          <tr>
            <td align="center" style="padding:32px 32px 24px 32px;border-bottom:1px solid #2a2a2e;">
              <img src="https://landofredemption.com/brand/lor-wordmark-email.png" alt="Land of Redemption" width="200" height="54" style="display:block;width:200px;height:auto;border:0;" />
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 12px 0;font-size:22px;font-weight:600;color:#f4f4f5;">Your verification code</h1>
              <p style="margin:0 0 28px 0;font-size:15px;line-height:1.6;color:#d4d4d8;">Enter this code to confirm it's you:</p>
              <p style="margin:0 0 28px 0;font-size:28px;font-weight:600;letter-spacing:6px;text-align:center;color:#f4f4f5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{ .Token }}</p>
              <p style="margin:0;padding-top:24px;border-top:1px solid #2a2a2e;font-size:13px;line-height:1.6;color:#a1a1aa;">If you didn't ask for a code, you can ignore this email.</p>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0 0;font-size:12px;color:#71717a;">Land of Redemption &mdash; <a href="https://landofredemption.com" style="color:#a1a1aa;text-decoration:none;">landofredemption.com</a></p>
      </td>
    </tr>
  </table>
</body>
</html>
